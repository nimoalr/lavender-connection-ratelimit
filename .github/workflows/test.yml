name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Run test suite
        run: lua5.4 tests/run.lua
